[mesh]
nx = 64
ny = 64
nz = 64
# lx = 12.566370614359172   # domain size in x (default 4*pi)
# ly = 2.0                  # domain size in y (default 2)
# lz = 4.188790204786391    # domain size in z (default 4*pi/3)

[physics]
mach_bulk = 0.3
# initial_condition = "channel"  # channel | uniform
# y_boundary = "wall"            # wall | periodic

[solver]
n_steps = 10
dt = 0.0001
flux_scheme = "slau2"

[io]
save_freq = 1
output_dir = "output"
prefix = "flow"

[precision]
u_real = "f32"
q_real = "f32"
rhs_real = "f32"
compute_real = "f32"
